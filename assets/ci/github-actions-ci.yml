# CI de Python (schematize-python). Copie para .github/workflows/ci.yml.
# Config do ruff: assets/lint/ruff.toml (estenda no pyproject.toml).
name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Dependencias (ferramentas isoladas do app)
        run: python -m pip install ruff mypy pytest pip-audit && python -m pip install -e . || true
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy --strict src
      - run: pytest -q
      - run: pip-audit
